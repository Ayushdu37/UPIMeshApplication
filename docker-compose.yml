version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Spring Boot Backend Application
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upi-mesh-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/upimesh
      - SPRING_DATASOURCE_USERNAME=upiuser
      - SPRING_DATASOURCE_PASSWORD=upipassword
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - BRIDGE_API_KEY=demo-bridge-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: upi-mesh-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=upimesh
      - POSTGRES_USER=upiuser
      - POSTGRES_PASSWORD=upipassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upiuser -d upimesh"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis Distributed Idempotency Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: upi-mesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
